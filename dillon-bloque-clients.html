<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dillon Martella — Bloque Client Assignments</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
h1{margin:0 0 4px;font-size:26px}
.sub{color:#8b949e;font-size:14px}
.total{display:inline-block;margin-top:10px;background:#161b22;border:1px solid #30363d;padding:6px 14px;border-radius:20px;font-size:14px}
.total b{color:#58a6ff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--c)}
.chip.active{background:var(--c);border-color:var(--c);color:#0d1117;font-weight:600}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.active .dot{background:#0d1117}
.chip .cnt{background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px;font-size:12px}
.chip.active .cnt{background:rgba(0,0,0,.2)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
input[type=search],select{background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:9px 12px;border-radius:8px;font-size:14px}
input[type=search]{flex:1;min-width:220px}
table{width:100%;border-collapse:collapse;background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden}
thead th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#8b949e;padding:12px 14px;border-bottom:1px solid #30363d}
tbody td{padding:11px 14px;border-bottom:1px solid #21262d;font-size:14px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#1c2230}
.name a{color:#e6edf3;text-decoration:none;font-weight:500}
.name a:hover{color:#58a6ff;text-decoration:underline}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#0d1117;white-space:nowrap}
.link a{color:#58a6ff;text-decoration:none;font-size:13px}
.link a:hover{text-decoration:underline}
.empty{text-align:center;color:#8b949e;padding:30px;display:none}
footer{margin-top:22px;color:#6e7681;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dillon Martella — Bloque Client Assignments</h1>
  <div class="sub">ClaimsForce CRM · Last updated July 27, 2026 at 05:47 PM MST</div>
  <div class="total"><b id="tot">0</b> assigned clients</div>
  <div class="chips" id="chips"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search client name…">
    <select id="stageSel"><option value="__all">All stages</option></select>
  </div>
  <table>
    <thead><tr><th>Client</th><th>Stage</th><th>CRM</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty">No clients match your filters.</div>
  <footer>Generated automatically from ClaimsForce CRM. Full rebuild — reflects only records currently assigned to Dillon Martella.</footer>
</div>
<script>
var DATA=["6a4fc5da65ebc68a3|Dusty and Shannon Harrison|In Negotiations","6a4c1c44a9a1db31e|Bob Dehler|In Negotiations","6a4c123a30e885f75|Douglas Shipe|Estimate Review","6a46d26a61fd53a41|Patricia Adam|Estimate Request","6a4572d61fed4b58d|Eric Bolek|In Negotiations","6a453886b5fb7bcd0|Tim (Realtor)|Need Assistance","6a3d5964aa5ab5ac9|Michelle Schroeder|In Negotiations","6a3bfeb824338cede|Lucas Nicholas|In Negotiations","6a3ad7f3830198ecf|Ramon Aldecoa|In Negotiations","6a3467bc2257eafc2|Edward Amack|In Negotiations","6a0f20b97ce433b63|Christina Molina|In Negotiations","69cd4c12273634c1f|Rito Orrantia|Opportunity Won","69c15cbc93389c11e|Richard Core|In Negotiations","69bc680194eabf70e|Dori Stoesz|In Negotiations","69bb27801e2f83f72|Miguel Silva|In Negotiations","69b9d95caf5bebf06|Heather Potter|In Negotiations","69b898529c7d5b19a|Katherine Hurd|In Negotiations","69b8807194925ff47|Linh Tompkins|In Negotiations","69b1f2dac04efb1ba|Gilbert Phillip Stewart|In Negotiations","69a7520d78416bf88|Chelsea Benton|Need Assistance","699ddfe4a3348cd41|Sally Wang|Opportunity Won","69972ee426fcd918e|Dondrell Swanson|Opportunity Won","6993aa03c445151bf|Waldher Seminario|In Negotiations","6993a787c7e18264f|Tanner Marvin Fosmire|In Negotiations","699340d0cc66f1bb2|Madison Morgan|Opportunity Won","698676c37918ec360|Ann Tromba|In Negotiations","6980bac30ca565e86|Kevin Richardson|In Negotiations","697b8abd5dc1190a0|Steven Emery|Need Assistance","69725117b5731a8ec|Renee Dominguez|Need Assistance","6969081cebcb4b9c4|Perris Henderson|Opportunity Won","69666093660930ab3|Ema Delgado|Opportunity Won","69556d9bd302abc9c|Jan Chrisner|Need Assistance","6949bca59e8722d30|Kevin Moore|In Negotiations","6942cd28bd69b185e|Lynda Lydick|Need Assistance","69408ede23a12c952|Gary Rinear|In Negotiations","6939e78a24b8b675c|Mindy Greene|Opportunity Won","6939a48d5e7fec499|James Motte|In Negotiations","6930c2b6b433010ed|Jonathan Elias|Need Assistance","6930b1937ff4443f3|David Wilkinson|In Negotiations","691e055b14901f121|Richard Long|In Negotiations","691dee3930c31dd92|Darin Jasper|In Negotiations","690388d3194d17adb|Ramon Navarro|In Negotiations","6903824649d7fcc08|William Werner|In Negotiations","68fab276135ba4f76|James Phelps|In Negotiations","68f94df1d581086fb|Barbara Mills|In Negotiations","68f2a70ed01f98aa6|Aurora Garcia|Need Assistance","68f1135a4cb591dcf|Logan Steward|In Negotiations","68ee9690a3a88983e|Mary Alice Robinson|Opportunity Won","68ed88d78af2e44aa|John Schmiesing|Opportunity Won","68ed26fe1b0c9d56e|Christine DeRuvo (VIP)|Need Assistance","68ed21f098c79a724|Austin Jardine|Need Assistance"];
var ORDER=["Lead","Opportunity","Assigned","Estimate Request","Review 1st Estimate","Estimate Review","Estimate Complete","In Negotiations","Additional Supps","Need Assistance","Opportunity Won","Opportunity Lost"];
var COLORS={"Lead":"#6c757d","Opportunity":"#17a2b8","Assigned":"#007bff","Estimate Request":"#fd7e14","Review 1st Estimate":"#e83e8c","Estimate Review":"#6f42c1","Estimate Complete":"#20c997","In Negotiations":"#ffc107","Additional Supps":"#dc3545","Need Assistance":"#ff4444","Opportunity Won":"#28a745","Opportunity Lost":"#6c757d"};
var CRM="https://sa.claimsforce.net/#BloqueClient/view/";
function ok(s){return ORDER.indexOf(s)<0?ORDER.length:ORDER.indexOf(s)}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
var rows=DATA.map(function(r){var i=r.indexOf("|");var j=r.indexOf("|",i+1);return{id:r.slice(0,i),name:r.slice(i+1,j),stage:r.slice(j+1)}});
rows.sort(function(a,b){var d=ok(a.stage)-ok(b.stage);return d!==0?d:a.name.toLowerCase()<b.name.toLowerCase()?-1:1});
var counts={};rows.forEach(function(r){counts[r.stage]=(counts[r.stage]||0)+1});
var stages=Object.keys(counts).sort(function(a,b){return ok(a)-ok(b)});
document.getElementById("tot").textContent=rows.length;
var chips=document.getElementById("chips");
chips.innerHTML='<button class="chip active" data-stage="__all" style="--c:#58a6ff"><span class="dot"></span>All<span class="cnt">'+rows.length+'</span></button>'+stages.map(function(s){var c=COLORS[s]||"#6c757d";return '<button class="chip" data-stage="'+esc(s)+'" style="--c:'+c+'"><span class="dot"></span>'+esc(s)+'<span class="cnt">'+counts[s]+'</span></button>'}).join("");
var sel=document.getElementById("stageSel");
sel.innerHTML='<option value="__all">All stages</option>'+stages.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+' ('+counts[s]+')</option>'}).join("");
var tbody=document.getElementById("tbody");
tbody.innerHTML=rows.map(function(r){var c=COLORS[r.stage]||"#6c757d";var u=CRM+r.id;return '<tr data-stage="'+esc(r.stage)+'" data-name="'+esc(r.name.toLowerCase())+'"><td class="name"><a href="'+u+'" target="_blank" rel="noopener">'+esc(r.name)+'</a></td><td><span class="badge" style="background:'+c+'">'+esc(r.stage)+'</span></td><td class="link"><a href="'+u+'" target="_blank" rel="noopener">Open in CRM ↗</a></td></tr>'}).join("");
var trs=Array.prototype.slice.call(tbody.querySelectorAll("tr"));
var q=document.getElementById("q"),empty=document.getElementById("empty"),active="__all";
var chipEls=Array.prototype.slice.call(chips.querySelectorAll(".chip"));
function apply(){var t=q.value.trim().toLowerCase(),shown=0;trs.forEach(function(tr){var oks=active==="__all"||tr.getAttribute("data-stage")===active;var okn=!t||tr.getAttribute("data-name").indexOf(t)!==-1;var v=oks&&okn;tr.style.display=v?"":"none";if(v)shown++});empty.style.display=shown?"none":"block"}
function setStage(s){active=s;chipEls.forEach(function(c){c.classList.toggle("active",c.getAttribute("data-stage")===s)});sel.value=s;apply()}
chipEls.forEach(function(c){c.addEventListener("click",function(){setStage(c.getAttribute("data-stage"))})});
sel.addEventListener("change",function(){setStage(sel.value)});
q.addEventListener("input",apply);
</script>
</body>
</html>
